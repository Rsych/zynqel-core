<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynqel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { margin: 0; padding: 0; }
    #terminal-container .xterm { height: 100%; }
  </style>
</head>
<body class="bg-black text-gray-200 h-screen flex flex-col font-mono">

  <!-- Toolbar -->
  <div class="flex items-center gap-3 px-4 py-2 bg-neutral-900 border-b border-neutral-800 text-sm">
    <span class="text-green-400 font-bold tracking-wider">ZYNQEL</span>
    <div class="h-4 w-px bg-neutral-700"></div>
    <button id="btn-new" class="bg-green-900/50 hover:bg-green-800/50 border border-green-700/50 rounded px-3 py-1 text-green-400 text-xs">+ New</button>
    <button id="btn-workspaces" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded px-3 py-1 text-blue-400 text-xs">Workspaces</button>
    <span id="current-workspace" class="hidden flex items-center gap-2">
      <span class="text-xs text-neutral-400">workspace:</span>
      <span class="text-xs text-gray-200 font-mono" id="current-ws-name"></span>
      <button id="btn-stop" class="bg-red-900/30 hover:bg-red-800/40 border border-red-700/40 rounded px-3 py-1 text-red-400 text-xs">Stop</button>
    </span>
    <div class="ml-auto flex items-center gap-2">
      <span id="status" class="text-xs text-neutral-500">
        <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1 align-middle"></span>disconnected
      </span>
    </div>
  </div>

  <!-- Terminal -->
  <div id="terminal-container" class="flex-1 overflow-hidden relative">
    <div id="prompt-overlay" class="absolute bottom-4 right-4 z-10 flex flex-col gap-2"></div>
  </div>

  <!-- New Session Modal -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
    <div class="bg-neutral-900 border border-neutral-700 rounded-lg p-6 w-[460px] shadow-2xl">
      <h2 class="text-green-400 font-bold text-base mb-4 tracking-wide">NEW SESSION</h2>

      <label class="block text-xs text-neutral-500 mb-1 mt-3">AGENT</label>
      <select id="m-agent" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-gray-200">
        <option value="shell">Shell (ubuntu)</option>
        <option value="claude">Claude Code</option>
        <option value="qwen">Qwen Code</option>
      </select>

      <label class="block text-xs text-neutral-500 mb-1 mt-4">REPOSITORY</label>
      <input id="m-repo" type="text" placeholder="https://github.com/user/repo.git" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-gray-200 placeholder-neutral-600">
      <p class="text-[10px] text-neutral-600 mt-1">Leave empty for a blank workspace</p>

      <label class="block text-xs text-neutral-500 mb-1 mt-4">BRANCH</label>
      <input id="m-branch" type="text" placeholder="main" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-gray-200 placeholder-neutral-600">

      <label class="block text-xs text-neutral-500 mb-1 mt-4">WORKSPACE ID</label>
      <input id="m-workspace" type="text" placeholder="auto-generated from repo" class="w-full bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm text-gray-200 placeholder-neutral-600">
      <p class="text-[10px] text-neutral-600 mt-1">Same ID = resume previous work. Empty = ephemeral session.</p>

      <div id="m-error" class="hidden mt-4 bg-red-900/20 border border-red-700/40 rounded px-3 py-2 text-sm text-red-400"></div>
      <div class="flex gap-2 mt-4 justify-end">
        <button id="m-cancel" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded px-4 py-2 text-sm text-gray-400">Cancel</button>
        <button id="m-create" class="bg-green-900/60 hover:bg-green-800/60 border border-green-700/50 rounded px-4 py-2 text-sm text-green-400 font-semibold">Create</button>
      </div>
    </div>
  </div>

  <!-- Workspaces Modal -->
  <div id="ws-overlay" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
    <div class="bg-neutral-900 border border-neutral-700 rounded-lg p-6 w-[500px] shadow-2xl max-h-[70vh] flex flex-col">
      <h2 class="text-blue-400 font-bold text-base mb-4 tracking-wide">SAVED WORKSPACES</h2>
      <div id="ws-list" class="flex-1 overflow-y-auto space-y-2 min-h-[100px]">
        <p class="text-neutral-500 text-sm">Loading...</p>
      </div>
      <div class="flex justify-between mt-4">
        <button id="ws-delete-all" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded px-3 py-2 text-xs text-neutral-500">Delete All</button>
        <button id="ws-close" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded px-4 py-2 text-sm text-gray-400">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="console.js"></script>
</body>
</html>
