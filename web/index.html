<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynqel Dev Console</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    #toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; }
    #toolbar h1 { font-size: 14px; font-weight: 600; color: #a0c4ff; }
    #toolbar select, #toolbar button { font-size: 13px; padding: 4px 10px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #e0e0e0; cursor: pointer; }
    #toolbar button { background: #0f3460; }
    #toolbar button:hover { background: #1a5276; }
    #toolbar button.danger { background: #5c1a1a; }
    #toolbar button.danger:hover { background: #7a2020; }
    #status { margin-left: auto; font-size: 12px; color: #888; }
    #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    #status .dot.connected { background: #4caf50; }
    #status .dot.disconnected { background: #f44336; }
    #terminal-container { flex: 1; padding: 4px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>Zynqel</h1>
    <select id="session-select"><option value="">-- select session --</option></select>
    <button id="btn-create">Create</button>
    <button id="btn-kill" class="danger">Kill</button>
    <button id="btn-refresh">Refresh</button>
    <span id="status"><span class="dot disconnected"></span>disconnected</span>
  </div>
  <div id="terminal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="console.js"></script>
</body>
</html>
